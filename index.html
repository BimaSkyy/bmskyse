<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b13">
<title>BmSkySocialEngine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b13;
  --panel:rgba(10,16,30,.84);
  --field:#0b111d;
  --line:rgba(148,163,184,.16);
  --line-strong:rgba(148,163,184,.3);
  --text:#e8eef9;
  --muted:#8796b0;
  --accent:#4c8dff;
  --accent-2:#26d0ce;
  --ok:#34d399;
  --err:#fb7185;
  --warn:#fbbf24;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{
  margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;overflow-x:hidden;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Latar ---------- */
html,body{touch-action:pan-y}
#space{position:fixed;inset:0;z-index:-1;display:block;width:100%;height:100%;pointer-events:none;background:#040815}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:14px 18px;background:rgba(5,9,18,.72);
  border-bottom:1px solid var(--line);
}
.logo{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px -6px var(--accent);
}
.logo svg{width:18px;height:18px;fill:#fff}
header b{font-weight:800;font-size:16px;letter-spacing:-.01em}

/* ---------- Layout ---------- */
main{max-width:520px;margin:0 auto;padding:28px 16px 72px}
.hero h1{margin:0 0 6px;font-size:28px;line-height:1.15;letter-spacing:-.025em;font-weight:800}
.hero p{margin:0 0 22px;color:var(--muted);max-width:40ch}

.reveal{opacity:0;transform:translateY(14px);animation:rise .7s var(--ease) forwards}
.reveal:nth-child(2){animation-delay:.08s}
.reveal:nth-child(3){animation-delay:.16s}
@keyframes rise{to{opacity:1;transform:none}}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;
  box-shadow:0 24px 60px -30px rgba(0,0,0,.7);
}

/* ---------- Tab ---------- */
.tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:rgba(255,255,255,.04);--i:0}
.ind{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#3a6fe0);box-shadow:0 8px 20px -8px var(--accent);
  transform:translateX(calc(var(--i) * 100%));transition:transform .4s cubic-bezier(.3,1.25,.45,1);
}
.tab{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 4px;border:0;background:none;border-radius:10px;color:var(--muted);
  font-size:12px;font-weight:600;line-height:1.15;text-align:center;transition:color .25s;
}
.tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.tab[aria-selected="true"]{color:#fff}
.tab[aria-selected="true"] svg{transform:scale(1.12)}

/* ---------- Form ---------- */
.pane{display:none;padding:6px 4px 4px}
.pane.on{display:block;animation:paneIn .35s var(--ease)}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.field{margin-top:14px}
.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:600;color:#b8c4da}
.control{
  position:relative;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;
  background:var(--field);border:1px solid var(--line-strong);border-radius:12px;
  transition:border-color .2s,box-shadow .2s;
}
.control:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(76,141,255,.16)}
.control > svg{flex:none;width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.control input{flex:1;min-width:0;padding:13px 0;background:none;border:0;outline:0;font-size:15px}
.control input::placeholder{color:#55627a}
.mini{
  flex:none;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:rgba(255,255,255,.04);
  color:#c6d2e8;font-size:12px;font-weight:600;transition:background .2s,border-color .2s;
}
.mini:hover{background:rgba(255,255,255,.09);border-color:var(--accent)}
.control.invalid{border-color:var(--err);animation:shake .4s}
.control.invalid:focus-within{box-shadow:0 0 0 4px rgba(251,113,133,.16)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.msg{min-height:0;margin:6px 2px 0;font-size:12.5px;color:var(--err)}
.msg:empty{display:none}

.btn{
  position:relative;overflow:hidden;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),#3a6fe0 60%,#2a8fd8);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 12px 26px -12px var(--accent);transition:transform .15s,box-shadow .25s,opacity .2s;
}
.btn::after{
  content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);
  transform:translateX(-120%);transition:transform .7s var(--ease);
}
.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.7;cursor:progress}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.spin{display:inline-block;width:15px;height:15px;margin-right:8px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;vertical-align:-2px;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Riwayat ---------- */
.hist{margin-top:14px}
.hist[hidden]{display:none}
.hist p{margin:0 0 6px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  max-width:100%;padding:5px 10px;border:1px solid var(--line-strong);border-radius:999px;background:rgba(255,255,255,.03);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#b8c4da;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:border-color .2s,color .2s;
}
.chip:hover{border-color:var(--accent);color:#fff}

/* ---------- Hasil ---------- */
.result{
  margin-top:16px;padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
  animation:pop .5s var(--ease);
}
.result[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.result.ok{border-color:rgba(52,211,153,.35)}
.result.err{border-color:rgba(251,113,133,.38)}
.result.warn{border-color:rgba(251,191,36,.38)}
.rhead{display:flex;align-items:center;gap:12px}
.rhead h2{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.rhead small{display:block;margin-top:1px;font-size:12.5px;font-weight:500;color:var(--muted)}
.ico{flex:none;width:44px;height:44px}
.ico svg{width:100%;height:100%;overflow:visible}
.ico .ring,.ico .mark{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ico .ring{stroke-width:2;stroke-dasharray:151;stroke-dashoffset:151;animation:draw .6s ease forwards}
.ico .mark{stroke-width:3;stroke-dasharray:44;stroke-dashoffset:44;animation:draw .4s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ok .ico .ring,.ok .ico .mark{stroke:var(--ok)}
.err .ico .ring,.err .ico .mark{stroke:var(--err)}
.warn .ico .ring,.warn .ico .mark{stroke:var(--warn)}
.warn .ico svg{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.info .ico .ring,.info .ico .mark{stroke:var(--accent)}

.rbody{margin:14px 0 0;color:#c6d2e8;font-size:14px;overflow-wrap:anywhere}
.idrow{display:flex;gap:8px;margin-top:14px}
.idrow code{
  flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line-strong);border-radius:12px;background:var(--field);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--accent-2);
  overflow-x:auto;white-space:nowrap;user-select:all;
}
.act{display:flex;gap:8px;margin-top:12px}
.ghost{
  flex:1;padding:11px;border:1px solid var(--line-strong);border-radius:12px;background:rgba(255,255,255,.04);
  font-size:13.5px;font-weight:600;transition:background .2s,border-color .2s,color .2s;
}
.ghost:hover{background:rgba(255,255,255,.09);border-color:var(--accent)}
.ghost.done{color:var(--ok);border-color:rgba(52,211,153,.5)}
.idrow .ghost{flex:none;padding:0 16px}
.hint{margin:10px 2px 0;font-size:12px;color:var(--muted)}

/* ---------- Toast ---------- */
.toast{
  position:fixed;left:50%;bottom:24px;z-index:10;max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;
  background:#1a2338;border:1px solid var(--line-strong);font-size:13.5px;font-weight:600;
  box-shadow:0 14px 34px -10px rgba(0,0,0,.7);
  opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .3s,transform .35s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.hero h1,.hero p{text-shadow:0 2px 18px rgba(0,0,0,.7)}
.tip{
  position:fixed;left:50%;bottom:10px;z-index:4;transform:translateX(-50%);max-width:calc(100% - 24px);
  padding:6px 12px;border-radius:999px;background:rgba(10,16,30,.78);border:1px solid var(--line);
  font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none;animation:tipOut 1s 8s forwards;
}
.tip:empty{display:none}
@keyframes tipOut{to{opacity:0;visibility:hidden}}
@media (min-width:960px){
  main{margin-left:max(32px,6vw);margin-right:auto;padding-top:56px}
  .hero h1{font-size:34px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="tip" id="tip" aria-hidden="true"></div>

<header>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 13.5h6.2L9.5 22 20 9.8h-6.4z"/></svg></div>
  <b>BmSkySocialEngine</b>
</header>

<main>
  <section class="hero reveal">
    <h1>Boost video TikTok kamu</h1>
    <p>Pilih layanan, tempel link video, lalu pantau progres sesi dari satu tempat.</p>
  </section>

  <section class="card reveal">
    <div class="tabs" id="tabs" role="tablist" aria-label="Layanan">
      <span class="ind" aria-hidden="true"></span>
      <button class="tab" role="tab" id="t-fav" data-tab="fav" aria-selected="true" aria-controls="p-fav">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.8a4.3 4.3 0 0 1 7.5 2.5c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
        Favorites
      </button>
      <button class="tab" role="tab" id="t-ch" data-tab="ch" aria-selected="false" aria-controls="p-ch">
        <svg viewBox="0 0 24 24"><path d="M20.5 11.5a7.5 7.5 0 0 1-10.8 6.7L4 20l1.8-5.2A7.5 7.5 0 1 1 20.5 11.5z"/></svg>
        Comments-Hearts
      </button>
      <button class="tab" role="tab" id="t-cek" data-tab="cek" aria-selected="false" aria-controls="p-cek">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        Cek Sesi
      </button>
    </div>

    <!-- Favorites -->
    <form class="pane on" id="p-fav" role="tabpanel" aria-labelledby="t-fav" novalidate>
      <div class="field">
        <label for="favUrl">Link video TikTok</label>
        <div class="control">
          <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
          <input id="favUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://www.tiktok.com/@user/video/…">
          <button type="button" class="mini" data-paste="favUrl">Tempel</button>
        </div>
        <p class="msg" id="favUrl-msg" role="alert"></p>
      </div>
      <button class="btn" type="submit">Kirim Favorites</button>
    </form>

    <!-- Comments-Hearts -->
    <form class="pane" id="p-ch" role="tabpanel" aria-labelledby="t-ch" novalidate>
      <div class="field">
        <label for="chUrl">Link video TikTok</label>
        <div class="control">
          <svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/></svg>
          <input id="chUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://www.tiktok.com/@user/video/…">
          <button type="button" class="mini" data-paste="chUrl">Tempel</button>
        </div>
        <p class="msg" id="chUrl-msg" role="alert"></p>
      </div>
      <div class="field">
        <label for="chUser">Username pemilik komentar</label>
        <div class="control">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-3.6 3.6-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>
          <input id="chUser" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="username tanpa @">
        </div>
        <p class="msg" id="chUser-msg" role="alert"></p>
      </div>
      <button class="btn" type="submit">Kirim Comments-Hearts</button>
    </form>

    <!-- Cek Sesi -->
    <form class="pane" id="p-cek" role="tabpanel" aria-labelledby="t-cek" novalidate>
      <div class="field">
        <label for="cekId">Sesi-ID</label>
        <div class="control">
          <svg viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M9.5 4 8 20M16 4l-1.5 16"/></svg>
          <input id="cekId" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="bmskyFavorites-xxxx">
          <button type="button" class="mini" data-paste="cekId">Tempel</button>
        </div>
        <p class="msg" id="cekId-msg" role="alert"></p>
      </div>
      <div class="hist" id="hist" hidden>
        <p>Sesi terakhir</p>
        <div class="chips" id="chips"></div>
      </div>
      <button class="btn" type="submit">Cek Status</button>
    </form>
  </section>

  <section class="result" id="result" hidden aria-live="polite"></section>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  // Semua request lewat proxy server (api/proxy.js). URL ngrok tersimpan di
  // Environment Variable Vercel (NGROK_URL) dan tidak pernah dikirim ke browser.
  const API = "/api/proxy";
  const TIKTOK = /^https?:\/\/([\w-]+\.)?tiktok\.com\/\S+/i;
  const HKEY = "bmsky_sesi";

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const result = $("#result");
  const tabsEl = $("#tabs");
  const TABS = ["fav", "ch", "cek"];

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(text) {
    const el = $("#toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  }

  /* ---------- Tab ---------- */
  function showTab(t, focus) {
    const i = TABS.indexOf(t);
    tabsEl.style.setProperty("--i", i);
    $$(".tab").forEach(b => {
      const on = b.dataset.tab === t;
      b.setAttribute("aria-selected", on);
      b.tabIndex = on ? 0 : -1;
      if (on && focus) b.focus();
    });
    $$(".pane").forEach(p => p.classList.toggle("on", p.id === "p-" + t));
    hideResult();
  }
  $$(".tab").forEach(b => {
    b.addEventListener("click", () => showTab(b.dataset.tab));
    b.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const i = TABS.indexOf(b.dataset.tab);
      showTab(TABS[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3], true);
    });
  });
  showTab("fav");

  /* ---------- Field helper ---------- */
  function fieldError(id, text) {
    const input = $("#" + id);
    const ctl = input.closest(".control");
    ctl.classList.remove("invalid");
    void ctl.offsetWidth; // restart animasi shake
    ctl.classList.add("invalid");
    $("#" + id + "-msg").textContent = text;
    input.focus();
  }
  function clearErrors(form) {
    $$(".control", form).forEach(c => c.classList.remove("invalid"));
    $$(".msg", form).forEach(m => (m.textContent = ""));
  }
  $$("input").forEach(i => i.addEventListener("input", () => {
    i.closest(".control").classList.remove("invalid");
    $("#" + i.id + "-msg").textContent = "";
  }));

  $$("[data-paste]").forEach(b => b.addEventListener("click", async () => {
    const input = $("#" + b.dataset.paste);
    try {
      input.value = (await navigator.clipboard.readText()).trim();
      input.dispatchEvent(new Event("input"));
      input.focus();
    } catch {
      toast("Izinkan akses clipboard atau tempel manual");
    }
  }));

  /* ---------- Tombol ---------- */
  function setBusy(btn, busy) {
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.disabled = busy;
    btn.innerHTML = busy ? '<span class="spin"></span>Memproses…' : esc(btn.dataset.label);
  }
  document.addEventListener("pointerdown", e => {
    const btn = e.target.closest(".btn");
    if (!btn || btn.disabled) return;
    const r = btn.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2;
    const s = document.createElement("span");
    s.className = "rip";
    s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
    btn.appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  });

  /* ---------- API ---------- */
  async function callApi(service, params) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 35000);
    try {
      const qs = new URLSearchParams({ p: service, ...params });
      const r = await fetch(`${API}?${qs}`, { cache: "no-store", signal: ctrl.signal });
      try { return await r.json(); }
      catch { return { status: "error", massage: "Respons server tidak valid" }; }
    } catch (e) {
      return { status: "error", massage: e.name === "AbortError" ? "Server terlalu lama merespons, coba lagi" : "Tidak ada koneksi internet" };
    } finally {
      clearTimeout(timer);
    }
  }

  /* ---------- Hasil ---------- */
  const ICONS = {
    ok: '<circle class="ring" cx="26" cy="26" r="24"/><path class="mark" d="M15 27l8 8 14-16"/>',
    err: '<circle class="ring" cx="26" cy="26" r="24"/><path class="mark" d="M18 18l16 16M34 18 18 34"/>',
    warn: '<circle class="ring" cx="26" cy="26" r="24"/><path class="mark" d="M26 14v13l8 5"/>',
    info: '<circle class="ring" cx="26" cy="26" r="24"/><path class="mark" d="M26 24v12M26 17v1"/>'
  };
  function paint(kind, title, sub) {
    result.hidden = false;
    result.className = "result " + kind;
    result.innerHTML =
      `<div class="rhead"><div class="ico"><svg viewBox="0 0 52 52">${ICONS[kind]}</svg></div>
       <h2>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}</h2></div>`;
    return result;
  }
  function hideResult() { result.hidden = true; result.innerHTML = ""; }
  function scrollToResult() { result.scrollIntoView({ behavior: "smooth", block: "nearest" }); }

  function showSession(id) {
    addHist(id);
    paint("ok", "Berhasil dikirim", "Simpan Sesi-ID ini untuk memantau progres");
    result.insertAdjacentHTML("beforeend",
      `<div class="idrow"><code>${esc(id)}</code><button class="ghost" id="copyBtn" type="button">Salin</button></div>
       <div class="act"><button class="ghost" id="goCheck" type="button">Lihat status sesi</button></div>`);
    $("#copyBtn").addEventListener("click", e => copy(id, e.currentTarget));
    $("#goCheck").addEventListener("click", () => openCheck(id));
    scrollToResult();
  }

  const OK = ["success", "done", "completed", "selesai", "finished"];
  const BAD = ["error", "failed", "gagal"];

  }

  }

  function showFail(d) {
    paint("err", "Gagal memproses", d.massage || "Terjadi kesalahan yang tidak diketahui");
    scrollToResult();
  }

  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      document.execCommand("copy"); t.remove();

  }

  const getHist = () => { try { return JSON.parse(localStorage.getItem(HKEY) || "[]"); } catch { return []; } };
  function addHist(id) {
    const h = [id, ...getHist().filter(x => x !== id)].slice(0, 5);

      $("#cekId").value = c.title;
      $("#cekId").dispatchEvent(new Event("input"));

  /* ---------- Aksi ---------- */
  async function runCheck(id) {
    const btn = $("#p-cek .btn");

  addEventListener("pointermove", e => {
    if (e.pointerType === "mouse") {
      tYaw = (e.clientX / W - 0.5) * 0.35; tPitch = -(e.clientY / H - 0.5) * 0.16;
      if (!dragging) hover = isUI(e.target) ? null : pick(e.clientX, e.clientY);
      document.documentElement.style.cursor = hover ? "pointer" : "";
    }
    if (!dragging || e.pointerId !== dragId) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    yawUser += dx * 0.0065;
    pitchUser = clamp(pitchUser + dy * 0.0045, -0.6, 0.5);
    velYaw = velYaw * 0.5 + dx * 0.0065 * 60 * 0.5;
    velPitch = velPitch * 0.5 + dy * 0.0045 * 60 * 0.5;
  });
  const endDrag = e => {
    if (!dragging || e.pointerId !== dragId) return;
    dragging = false;
    if (moved < 8) {
      const o = pick(e.clientX, e.clientY);
      if (o) { pinned = o; pinUntil = performance.now() + 3200; }
      velYaw = velPitch = 0;
    }
  };
  addEventListener("pointerup", endDrag);
  addEventListener("pointercancel", endDrag);
  document.documentElement.addEventListener("mouseleave", () => { hover = null; tYaw = tPitch = 0; document.documentElement.style.cursor = ""; });

  /* ---------- Gambar ---------- */
  const sh = { on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1 };
  let shNext = rnd(4, 9);

  function drawGalaxy(t) {
    if (!spiral) return;
    const wide = W >= 960 && W > H;
    const gx = (wide ? W * 0.2 : W * 0.26) - yaw * 18, gy = (wide ? H * 0.32 : H * 0.30) + pitch * 10;
    const gs = Math.max(W, H) * (wide ? 0.8 : 0.95);
    ctx.save();
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.9;
    ctx.translate(gx, gy); ctx.rotate(-0.62); ctx.scale(1, 0.32); ctx.rotate(t * 0.02);
    ctx.drawImage(spiral, -gs / 2, -gs / 2, gs, gs);
    ctx.restore();
  }

  function drawStars(t) {
    const ox = yaw * 140, oy = pitch * 60;
    for (let i = 0; i < sN; i++) {
      const z = sZ[i];
      let x = (sX[i] * W + ox * z) % W; if (x < 0) x += W;
      let y = (sY[i] * H + oy * z) % H; if (y < 0) y += H;
      const a = sA[i] * (0.65 + 0.35 * Math.sin(t * sSp[i] + sPh[i]));
      ctx.globalAlpha = a; ctx.fillStyle = STAR_COL[sC[i]];
      ctx.fillRect(x, y, sS[i], sS[i]);
      if (i < 7) { ctx.globalAlpha = a * 0.8; ctx.drawImage(starGlow, x - 9, y - 9, 18, 18); }
    }
    ctx.globalAlpha = 1;
  }

  function drawShooting(dt) {
    if (reduce) return;
    shNext -= dt;
    if (!sh.on && shNext <= 0) {
      const sp = rnd(520, 760), a = rnd(0.35, 0.6);
      sh.on = true; sh.x = rnd(W * 0.3, W); sh.y = rnd(0, H * 0.35);
      sh.vx = -Math.cos(a) * sp; sh.vy = Math.sin(a) * sp; sh.life = 0; sh.max = rnd(0.7, 1.1); shNext = rnd(6, 13);
    }
    if (!sh.on) return;
    sh.life += dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    const k = 1 - sh.life / sh.max;
    if (k <= 0) { sh.on = false; return; }
    const tx = sh.x - sh.vx * 0.12, ty = sh.y - sh.vy * 0.12;
    const gr = ctx.createLinearGradient(sh.x, sh.y, tx, ty);
    gr.addColorStop(0, `rgba(210,230,255,${k})`); gr.addColorStop(1, "rgba(210,230,255,0)");
    ctx.strokeStyle = gr; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(tx, ty); ctx.stroke();
  }

  function ringPass(p, front) {
    ctx.strokeStyle = "rgba(232,214,170,.62)";
    ctx.lineWidth = Math.max(1.5, p.s * 0.55 * p.k * S * sizeBoost);
    ctx.beginPath();
    for (let i = 0; i < RING_N; i++) {
      const isFront = (p.rz[i] + p.rz[i + 1]) * 0.5 < p.pz;
      if (isFront !== front) continue;
      ctx.moveTo(p.rx[i], p.ry[i]); ctx.lineTo(p.rx[i + 1], p.ry[i + 1]);
    }
    ctx.stroke();
  }

  function drawSun(e, t) {
    const r = e.r, pulse = 1 + 0.035 * Math.sin(t * 1.6);
    ctx.globalCompositeOperation = "lighter";
    let g = r * 5.2 * pulse;
    ctx.globalAlpha = 0.9; ctx.drawImage(sunGlow, e.x - g, e.y - g, g * 2, g * 2);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.drawImage(sunCore, e.x - r, e.y - r, r * 2, r * 2);
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.55;
    g = r * 1.9 * pulse; ctx.drawImage(sunGlow, e.x - g, e.y - g, g * 2, g * 2);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }

  function drawBody(tex, x, y, r) {
    ctx.drawImage(tex, x - r, y - r, r * 2, r * 2);
    ctx.save();
    ctx.translate(x, y); ctx.rotate(Math.atan2(SUN.sy - y, SUN.sx - x));
    ctx.drawImage(shade, -r, -r, r * 2, r * 2);
    ctx.restore();
  }

  function drawPlanet(p) {
    const r = p.sr;
    if (p.ring) ringPass(p, false);
    drawBody(p.tex, p.sx, p.sy, r);
    if (p.glowSp) {
      const g = r * 1.6;
      ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.8;
      ctx.drawImage(p.glowSp, p.sx - g, p.sy - g, g * 2, g * 2);
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    }
    if (p.ring) ringPass(p, true);
    if (p === hover) {
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 5, 0, TAU); ctx.stroke();
    }
  }

  function drawSystem(t) {
    cosY = Math.cos(yaw); sinY = Math.sin(yaw); cosP = Math.cos(pitch); sinP = Math.sin(pitch);

    // jalur orbit (satu path untuk semua)
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(130,175,255,.16)";
    ctx.beginPath();
    for (const p of PLANETS) {
      for (let i = 0; i <= SEG; i++) {
        const a = (i / SEG) * TAU; project(Math.cos(a) * p.r, 0, Math.sin(a) * p.r);
        i ? ctx.lineTo(P.x, P.y) : ctx.moveTo(P.x, P.y);
      }
    }
    ctx.stroke();
    if (hover && hover.r) {
      ctx.strokeStyle = "rgba(160,200,255,.5)"; ctx.beginPath();
      for (let i = 0; i <= SEG; i++) {
        const a = (i / SEG) * TAU; project(Math.cos(a) * hover.r, 0, Math.sin(a) * hover.r);
        i ? ctx.lineTo(P.x, P.y) : ctx.moveTo(P.x, P.y);
      }
      ctx.stroke();
    }

    // sabuk asteroid
    ctx.fillStyle = "rgba(200,194,182,.7)";
    const bw = t * (TAU / 72);
    for (let i = 0; i < bN; i++) {
      const a = bA[i] + bw;
      project(Math.cos(a) * bR[i], bY[i], Math.sin(a) * bR[i]);
      ctx.fillRect(P.x, P.y, bS[i] * P.k, bS[i] * P.k);
    }

    // kumpulkan benda, urutkan dari terjauh
    let n = 0;
    project(0, 0, 0);
    let e = ents[n++];
    e.kind = 0; e.p = null; e.x = P.x; e.y = P.y; e.z = P.z; e.r = 34 * P.k * S * sizeBoost * 0.9;
    SUN.sx = P.x; SUN.sy = P.y; SUN.sr = e.r;

    for (const p of PLANETS) {
      const a = p.a0 + t * p.w, wx = Math.cos(a) * p.r, wz = Math.sin(a) * p.r;
      project(wx, 0, wz);
      p.sx = P.x; p.sy = P.y; p.k = P.k; p.pz = P.z; p.sr = p.s * P.k * S * sizeBoost;
      e = ents[n++]; e.kind = 1; e.p = p; e.x = P.x; e.y = P.y; e.z = P.z; e.r = p.sr;
      if (p.ring) {
        const rad = p.s * 2.05;
        for (let i = 0; i <= RING_N; i++) {
          const b = (i / RING_N) * TAU, lx2 = Math.cos(b) * rad, lz2 = Math.sin(b) * rad;
          project(wx + lx2, lx2 * 0.26, wz + lz2);
          p.rx[i] = P.x; p.ry[i] = P.y; p.rz[i] = P.z;
        }
      }
      if (p.moon) {
        const am = t * 1.1;
        project(wx + Math.cos(am) * 20, Math.sin(am) * 4, wz + Math.sin(am) * 20);
        MOON.sx = P.x; MOON.sy = P.y; MOON.sr = 2.8 * P.k * S * sizeBoost;
        e = ents[n++]; e.kind = 2; e.p = null; e.x = P.x; e.y = P.y; e.z = P.z; e.r = MOON.sr;
      }
    }
    for (let i = 1; i < n; i++) {
      const x = ents[i]; let j = i - 1;
      while (j >= 0 && ents[j].z < x.z) { ents[j + 1] = ents[j]; j--; }
      ents[j + 1] = x;
    }
    for (let i = 0; i < n; i++) {
      const x = ents[i];
      if (x.kind === 0) drawSun(x, t);
      else if (x.kind === 1) drawPlanet(x.p);
      else drawBody(moonTex, x.x, x.y, x.r);
    }
  }

  function drawLabel(now) {
    const o = hover || (pinned && now < pinUntil ? pinned : null);
    if (!o) return;
    const f1 = '700 12.5px "Plus Jakarta Sans",system-ui,sans-serif', f2 = '500 11px "Plus Jakarta Sans",system-ui,sans-serif';
    ctx.font = f1; const w1 = ctx.measureText(o.n).width;
    ctx.font = f2; const w2 = ctx.measureText(o.info).width;
    const w = Math.max(w1, w2) + 24, h = 40;
    const x = clamp(o.sx - w / 2, 8, W - w - 8);
    let y = o.sy - o.sr - h - 12; if (y < 8) y = o.sy + o.sr + 12;
    ctx.fillStyle = "rgba(8,14,28,.92)"; ctx.strokeStyle = "rgba(130,175,255,.5)"; ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 10); else ctx.rect(x, y, w, h);
    ctx.fill(); ctx.stroke();
    ctx.textAlign = "center";
    ctx.fillStyle = "#e8eef9"; ctx.font = f1; ctx.fillText(o.n, x + w / 2, y + 17);
    ctx.fillStyle = "#8fa3c4"; ctx.font = f2; ctx.fillText(o.info, x + w / 2, y + 32);
    ctx.textAlign = "left";
  }

  let t = 0;
  function render(dt, now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGalaxy(t);
    drawStars(t);
    drawShooting(dt);
    drawSystem(t);
    drawLabel(now);
  }

  /* ---------- Loop & kualitas adaptif ---------- */
  let raf = 0, last = 0, ts = 1, ema = 16, frames = 0;
  function degrade() {
    level++; q *= 0.78; renderScale = Math.max(0.6, renderScale * 0.82);
    frames = 0; ema = 16; applySize();
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const ms = now - last;
    if (ms < 15.5) return; // batasi ~60 fps (layar 120 Hz tidak boros)
    last = now; frames++;
    if (frames > 40) {
      ema = ema * 0.94 + ms * 0.06;
      if (frames % 90 === 0 && ema > 26 && level < 2) degrade();
    }
    const dt = Math.min(ms / 1000, 0.05);
    ts += ((hover ? 0.14 : 1) - ts) * Math.min(1, dt * 5);
    boost = Math.max(0, boost - dt * 1.2);
    t += dt * ts * (1 + boost * 5);
    yawAuto += dt * 0.025;
    if (!dragging) {
      yawUser += velYaw * dt; pitchUser = clamp(pitchUser + velPitch * dt, -0.6, 0.5);
      const f = Math.exp(-3 * dt); velYaw *= f; velPitch *= f;
    }
    const sm = Math.min(1, dt * 4);
    parYaw += (tYaw - parYaw) * sm; parPitch += (tPitch - parPitch) * sm;
    yaw = yawAuto + yawUser + parYaw;
    pitch = clamp(PBASE + pitchUser + parPitch, 0.32, 1.45);
    render(dt, now);
  }

  document.addEventListener("visibilitychange", () => {
    if (reduce) return;
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });
  let rt = 0;
  addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (Math.abs(w - W) < 2 && Math.abs(h - H) < 140) return; // abaikan naik-turun address bar HP
      applySize();
      if (reduce) render(0, 0);
    }, 160);
  });

  applySize();
  if (reduce) { yaw = 0.4; render(0, 0); }
  else { last = performance.now(); raf = requestAnimationFrame(frame); }
})();
</script>
</body>
</html>
